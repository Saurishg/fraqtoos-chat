<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#07080D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FraqtoOS">
<meta name="format-detection" content="telephone=no">
<title>FraqtoOS · Command Center</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   FraqtoOS · COMMAND CENTER  (rebuild 2026-08-22)

   Three panes: conversations | chat | live server rail.
   Keeps the Aurora palette (cyan/violet/rose on near-black) but drops the
   heavy frosted-glass chrome — at three panes the blur cost and the low
   text contrast both stopped paying for themselves.
   ========================================================================== */

:root{
  --bg:#07080D; --bg-1:#0B0D14; --bg-2:#11141E; --bg-3:#171B28;
  --line:#1E2333; --line-2:#2A3145;
  --tx:#E8ECF6; --tx-2:#A6B0C8; --tx-3:#6B7590;
  --cy:#5BE6D8; --vi:#8B7CFF; --ro:#E26BB0; --am:#F5B764; --gr:#5BD98A; --rd:#FF6B6B;
  --sidebar:264px; --rail:300px;
  --r:12px; --r-s:8px;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--tx);
  font:400 15px/1.6 Inter,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
/* One soft aurora wash, fixed and non-interactive — atmosphere without
   repainting a blur on every pane. */
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(720px 420px at 12% -8%, rgba(91,230,216,.10), transparent 60%),
    radial-gradient(680px 460px at 88% 108%, rgba(139,124,255,.11), transparent 60%);
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#3A4258}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px;border-radius:4px}

/* ── shell ─────────────────────────────────────────────────────────── */
#shell{
  position:relative; z-index:1; height:100%;
  display:grid; grid-template-columns:var(--sidebar) minmax(0,1fr) var(--rail);
}
#shell.no-rail{grid-template-columns:var(--sidebar) minmax(0,1fr) 0}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column}

/* ── sidebar ───────────────────────────────────────────────────────── */
#sidebar{background:var(--bg-1);border-right:1px solid var(--line)}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:16px 16px 12px;border-bottom:1px solid var(--line);
}
.dot{
  width:9px;height:9px;border-radius:50%;flex:none;
  background:var(--gr);box-shadow:0 0 10px var(--gr);
}
.dot.bad{background:var(--rd);box-shadow:0 0 10px var(--rd)}
.brand h1{
  font:600 15px/1 Outfit,sans-serif;letter-spacing:.3px;
  background:linear-gradient(92deg,var(--cy),var(--vi) 60%,var(--ro));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.searchwrap{padding:12px 12px 8px}
.searchwrap input{
  width:100%;background:var(--bg-2);border:1px solid var(--line);
  border-radius:var(--r-s);padding:9px 11px;font-size:13.5px;
}
.searchwrap input:focus{border-color:var(--cy);outline:none}
#convs{flex:1;overflow-y:auto;padding:4px 8px 8px}
.group{
  font:600 10.5px/1 Inter;letter-spacing:.13em;text-transform:uppercase;
  color:var(--tx-3);padding:14px 8px 7px;
}
.conv{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:9px 10px;border-radius:var(--r-s);color:var(--tx-2);
  font-size:13.5px;line-height:1.35;
}
.conv:hover{background:var(--bg-2);color:var(--tx)}
.conv.on{background:var(--bg-3);color:var(--tx);box-shadow:inset 2px 0 0 var(--cy)}
.conv .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv .x{opacity:0;color:var(--tx-3);font-size:16px;line-height:1;padding:0 2px}
.conv:hover .x{opacity:1}
.conv .x:hover{color:var(--rd)}
.sidefoot{padding:10px 12px;border-top:1px solid var(--line);display:grid;gap:6px}
.sbtn{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--r-s);
  color:var(--tx-2);font-size:13.5px;
}
.sbtn:hover{background:var(--bg-2);color:var(--tx)}
.sbtn.primary{background:var(--bg-3);color:var(--tx)}

/* ── centre ────────────────────────────────────────────────────────── */
#centre{background:var(--bg)}
.topbar{
  display:flex;align-items:center;gap:10px;padding:11px 16px;
  border-bottom:1px solid var(--line);background:var(--bg-1);
}
.views{display:flex;gap:3px;background:var(--bg-2);padding:3px;border-radius:9px}
.view-tab{
  padding:6px 13px;border-radius:6px;font-size:13px;color:var(--tx-3);font-weight:500;
}
.view-tab:hover{color:var(--tx-2)}
.view-tab.on{background:var(--bg-3);color:var(--tx)}
.spacer{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px;
  background:var(--bg-2);border:1px solid var(--line);border-radius:999px;
  font-size:12px;color:var(--tx-2);white-space:nowrap;
}
.pill select{background:none;border:0;font-size:12px;color:var(--tx);cursor:pointer}
.pill select option{background:var(--bg-2)}
.icobtn{
  width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
  color:var(--tx-3);font-size:15px;
}
.icobtn:hover{background:var(--bg-2);color:var(--tx)}
.icobtn.on{background:var(--bg-3);color:var(--cy)}

.view{flex:1;min-height:0;display:none;flex-direction:column}
.view.on{display:flex}

/* ── messages ──────────────────────────────────────────────────────── */
#stream{flex:1;overflow-y:auto;padding:24px 0 8px}
.wrap{max-width:820px;margin:0 auto;padding:0 24px}
.msg{margin-bottom:22px}
.who{
  display:flex;align-items:center;gap:8px;margin-bottom:7px;
  font:600 11px/1 Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3);
}
.msg.user .who{color:var(--cy)}
.msg.bot .who{color:var(--vi)}
.bubble{
  background:var(--bg-1);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;overflow-wrap:anywhere;
}
.msg.user .bubble{background:var(--bg-2);border-color:var(--line-2)}
.bubble p{margin:0 0 10px}.bubble p:last-child{margin:0}
.bubble ul,.bubble ol{margin:0 0 10px 20px}
.bubble li{margin:3px 0}
.bubble h1,.bubble h2,.bubble h3{font-family:Outfit,sans-serif;margin:14px 0 8px;line-height:1.3}
.bubble h1{font-size:19px}.bubble h2{font-size:17px}.bubble h3{font-size:15px}
.bubble code{
  font-family:var(--mono);font-size:12.5px;background:var(--bg-3);
  padding:1.5px 5px;border-radius:4px;color:var(--cy);
}
.bubble pre{
  background:#0a0c12;border:1px solid var(--line);border-radius:var(--r-s);
  padding:13px;overflow-x:auto;margin:0 0 10px;
}
.bubble pre code{background:none;padding:0;color:var(--tx);font-size:12.5px;line-height:1.55}
.bubble table{border-collapse:collapse;width:100%;margin:0 0 10px;font-size:13.5px}
.bubble th,.bubble td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.bubble th{background:var(--bg-2);font-weight:600}
.bubble a{color:var(--cy)}
.bubble blockquote{border-left:2px solid var(--vi);padding-left:12px;color:var(--tx-2);margin:0 0 10px}

/* thinking */
details.think{
  margin:0 0 10px;background:var(--bg-2);border:1px solid var(--line);
  border-radius:var(--r-s);overflow:hidden;
}
details.think summary{
  padding:8px 12px;font-size:12px;color:var(--vi);cursor:pointer;
  list-style:none;user-select:none;
}
details.think summary::-webkit-details-marker{display:none}
details.think .body{
  padding:0 12px 10px;font-family:var(--mono);font-size:11.5px;line-height:1.6;
  color:var(--tx-3);white-space:pre-wrap;max-height:260px;overflow-y:auto;
}

/* router trace + stats */
.trace{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font:500 11px/1.5 var(--mono);background:var(--bg-2);
  border:1px solid var(--line);color:var(--tx-3);
}
.chip b{color:var(--tx-2);font-weight:500}
.chip.cy{border-color:rgba(91,230,216,.3);color:var(--cy)}
.chip.vi{border-color:rgba(139,124,255,.3);color:var(--vi)}
.chip.ro{border-color:rgba(226,107,176,.3);color:var(--ro)}
.msgacts{display:flex;gap:4px;margin-top:8px;opacity:0;transition:opacity .12s}
.msg:hover .msgacts{opacity:1}
.act{
  font-size:11px;color:var(--tx-3);padding:3px 8px;border-radius:6px;
  border:1px solid var(--line);
}
.act:hover{color:var(--tx);border-color:var(--line-2);background:var(--bg-2)}

/* artifact launcher inside a message */
.artcard{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  margin:0 0 10px;padding:11px 13px;border-radius:var(--r-s);
  background:linear-gradient(92deg,rgba(91,230,216,.09),rgba(139,124,255,.09));
  border:1px solid rgba(139,124,255,.28);
}
.artcard:hover{border-color:var(--vi)}
.artcard .ic{font-size:17px}
.artcard .nm{flex:1;min-width:0;font-size:13.5px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artcard .go{font-size:11px;color:var(--vi);font-family:var(--mono)}

/* empty state */
.empty{display:grid;place-items:center;height:100%;text-align:center;padding:32px}
.empty h2{font:600 22px Outfit,sans-serif;margin-bottom:8px}
.empty p{color:var(--tx-3);font-size:14px;max-width:400px;margin-bottom:20px}
.starters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px}
.starter{
  padding:8px 13px;border:1px solid var(--line);border-radius:999px;
  font-size:13px;color:var(--tx-2);background:var(--bg-1);
}
.starter:hover{border-color:var(--cy);color:var(--tx)}

/* ── composer ──────────────────────────────────────────────────────── */
.composer{border-top:1px solid var(--line);background:var(--bg-1);padding:12px 0 14px}
.cbox{
  display:flex;align-items:flex-end;gap:8px;background:var(--bg-2);
  border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;
}
.cbox:focus-within{border-color:var(--cy)}
#input{
  flex:1;background:none;border:0;resize:none;outline:none;
  font-size:14.5px;line-height:1.55;max-height:190px;padding:6px 0;
}
#input::placeholder{color:var(--tx-3)}
.cbtn{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  flex:none;font-size:15px;color:var(--tx-3);
}
.cbtn:hover{background:var(--bg-3);color:var(--tx)}
.cbtn.send{background:linear-gradient(92deg,var(--cy),var(--vi));color:#06070c}
.cbtn.send:disabled{opacity:.4;cursor:not-allowed}
.cbtn.rec{background:var(--rd);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.chint{
  display:flex;align-items:center;gap:10px;margin-top:7px;
  font-size:11px;color:var(--tx-3);
}

/* ── rail ──────────────────────────────────────────────────────────── */
#rail{background:var(--bg-1);border-left:1px solid var(--line);overflow-y:auto}
#shell.no-rail #rail{display:none}
.rhead{
  display:flex;align-items:center;gap:8px;padding:14px 16px 10px;
  font:600 10.5px/1 Inter;letter-spacing:.13em;text-transform:uppercase;color:var(--tx-3);
}
.card{margin:0 12px 10px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.card .lbl{font:600 10.5px/1 Inter;letter-spacing:.11em;text-transform:uppercase;color:var(--tx-3);margin-bottom:9px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;margin:5px 0}
.kv .k{color:var(--tx-3)}
.kv .v{font-family:var(--mono);color:var(--tx)}
.bar{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--cy),var(--vi));transition:width .5s}
.bar.warn i{background:linear-gradient(90deg,var(--am),var(--rd))}
.big{font:600 21px/1 Outfit,sans-serif;font-variant-numeric:tabular-nums}
.sub{font-size:11px;color:var(--tx-3);margin-top:3px}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gr);margin-right:6px}
.led.off{background:var(--rd)}
.led.idle{background:var(--tx-3)}
.tun{display:flex;align-items:center;gap:7px;font-size:12px;margin:6px 0;color:var(--tx-2)}
.tun .nm{flex:1;text-transform:capitalize}
.tun .pr{font-family:var(--mono);font-size:10.5px;color:var(--tx-3)}

/* ── console view ──────────────────────────────────────────────────── */
.console{flex:1;overflow-y:auto;padding:20px 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.panel{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel h3{font:600 12px/1 Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3);margin-bottom:11px}
.logbox{
  font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--tx-2);
  background:#0a0c12;border:1px solid var(--line);border-radius:var(--r-s);
  padding:12px;max-height:340px;overflow:auto;white-space:pre-wrap;
}
.logtabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.logtab{padding:5px 10px;border-radius:6px;font-size:12px;color:var(--tx-3);border:1px solid var(--line)}
.logtab.on{background:var(--bg-3);color:var(--cy);border-color:var(--line-2)}
.botrow{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.botrow:last-child{border:0}
.botrow .nm{flex:1}

/* ── compare view ──────────────────────────────────────────────────── */
.cmp{flex:1;overflow:auto;padding:18px 24px}
.cmp-setup{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.cmp-cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.cmp-col{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:180px}
.cmp-col h4{
  display:flex;align-items:center;gap:7px;padding:11px 13px;border-bottom:1px solid var(--line);
  font:500 13px var(--mono);color:var(--tx);
}
.cmp-col .out{padding:13px;font-size:13.5px;overflow-y:auto;max-height:52vh;flex:1}
.cmp-col .ft{padding:9px 13px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}

/* ── artifact panel ────────────────────────────────────────────────── */
#artifact{
  position:fixed;top:0;right:0;bottom:0;width:min(660px,58vw);z-index:60;
  background:var(--bg-1);border-left:1px solid var(--line-2);
  display:none;flex-direction:column;box-shadow:-24px 0 60px rgba(0,0,0,.5);
}
#artifact.on{display:flex}
.ahead{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ahead .nm{flex:1;min-width:0;font:500 13.5px Outfit,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atabs{display:flex;gap:3px;background:var(--bg-2);padding:3px;border-radius:8px}
.atab{padding:5px 11px;border-radius:5px;font-size:12px;color:var(--tx-3)}
.atab.on{background:var(--bg-3);color:var(--tx)}
.abody{flex:1;min-height:0;position:relative}
#aframe{width:100%;height:100%;border:0;background:#fff;display:none}
#aframe.on{display:block}
#acode{
  position:absolute;inset:0;overflow:auto;padding:14px;margin:0;display:none;
  background:#0a0c12;font-family:var(--mono);font-size:12.5px;line-height:1.6;
}
#acode.on{display:block}
.afoot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:7px;flex-wrap:wrap}

/* ── misc ──────────────────────────────────────────────────────────── */
.btn{
  padding:7px 13px;border-radius:8px;font-size:12.5px;color:var(--tx-2);
  border:1px solid var(--line);background:var(--bg-2);
}
.btn:hover{color:var(--tx);border-color:var(--line-2)}
.btn.go{background:linear-gradient(92deg,var(--cy),var(--vi));color:#06070c;border:0;font-weight:600}
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);
  background:var(--bg-3);border:1px solid var(--line-2);border-radius:10px;
  padding:10px 17px;font-size:13px;z-index:90;opacity:0;transition:.25s;pointer-events:none;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none}
.scrim.on{display:block}
.cursor{display:inline-block;width:7px;height:15px;background:var(--cy);vertical-align:-2px;animation:bl .9s step-end infinite}
@keyframes bl{50%{opacity:0}}
.mobonly{display:none}


/* ── tools view ─────────────────────────────────────────────────────── */
.tools{flex:1;overflow-y:auto;padding:20px 24px}
.tool{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.tool > h3{
  display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:1px solid var(--line);
  font:600 12px/1 Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3);
}
.tool > h3 .badge{
  font:500 10.5px/1 var(--mono);letter-spacing:0;text-transform:none;
  padding:3px 7px;border-radius:999px;border:1px solid var(--line);color:var(--tx-3);
}
.tool > h3 .badge.ok{color:var(--gr);border-color:rgba(91,217,138,.35)}
.tool > h3 .badge.bad{color:var(--rd);border-color:rgba(255,107,107,.35)}
.tool .row{display:flex;gap:8px;padding:13px 15px;flex-wrap:wrap}
.tool .row input[type=text]{
  flex:1;min-width:200px;background:var(--bg-2);border:1px solid var(--line);
  border-radius:var(--r-s);padding:9px 12px;font-size:13.5px;
}
.tool .row input[type=text]:focus{border-color:var(--cy);outline:none}
.tool .out{padding:0 15px 14px;font-size:13.5px;max-height:46vh;overflow-y:auto}
.tool .out:empty{display:none}
.hit{
  display:block;padding:10px 12px;margin-bottom:7px;border-radius:var(--r-s);
  background:var(--bg-2);border:1px solid var(--line);text-decoration:none;
}
.hit:hover{border-color:var(--cy)}
.hit .t{color:var(--cy);font-size:13.5px;margin-bottom:3px}
.hit .u{color:var(--tx-3);font-size:11px;font-family:var(--mono);
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit .s{color:var(--tx-2);font-size:12.5px;margin-top:5px;line-height:1.5}
.prog{font-family:var(--mono);font-size:12px;color:var(--vi);padding:4px 0}
.attach{
  display:flex;align-items:center;gap:8px;margin-bottom:7px;padding:7px 11px;
  background:var(--bg-3);border:1px solid var(--line-2);border-radius:var(--r-s);font-size:12.5px;
}
.attach .x{margin-left:auto;color:var(--tx-3);cursor:pointer}
.attach .x:hover{color:var(--rd)}

/* ── responsive ────────────────────────────────────────────────────── */
@media(max-width:1180px){
  #shell{grid-template-columns:var(--sidebar) minmax(0,1fr)}
  #rail{

<!-- artifact -->

    <button class="btn" onclick="Art.copy()">Copy</button>
    <button class="btn" onclick="Art.download()">Download</button>
    <button class="btn" onclick="Art.newtab()">Open in tab</button>
  </div>
</div>

<div class="scrim" id="scrim" onclick="UI.closeAll()"></div>
<div id="toast"></div>

<script>
/* ==========================================================================
   FraqtoOS Command Center — app
   Backend contracts (server.py):
     POST /chat      {model,messages,system,temperature,images} → NDJSON lines
                     {thinking}|{token}|{error}|{stats:{model,prompt_tokens,
                     completion_tokens,tok_s}}
     POST /classify  {text} → {category,model,raw}
     GET  /models /health /gpu /status /tunnels /chia-harvester /voice/status
     GET/POST/DELETE /conversations[/id]   GET/POST/DELETE /memory
     POST /transcribe (multipart "audio") → {text}
     GET  /logs/{service}?lines=N → {lines}
   ========================================================================== */
'use strict';

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = t => String(t ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(`${path} → HTTP ${r.status}`);
  return r.json();
}
function toast(m, ms = 2400) {
  const t = $('#toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms);
}

const S = {
  conv: null, history: [], busy: false, models: [], speak: false,
  abort: null, artifacts: new Map(),
};

/* ── markdown ──────────────────────────────────────────────────────────
   Small renderer: escape first, then structure. Fenced blocks are pulled out
   before any inline pass so their contents can never be re-parsed as markdown
   (or as HTML). */
function md(src) {
  const blocks = [];
  let s = String(src ?? '').replace(/```(\w+)?\n?([\s\S]*?)```/g, (_, lang, code) => {
    blocks.push({ lang: lang || '', code });
    return `␀B${blocks.length - 1}␀`;
  });

  s = esc(s);
  s = s.replace(/^### (.*)$/gm, '<h3>$1</h3>')
       .replace(/^## (.*)$/gm, '<h2>$1</h2>')
       .replace(/^# (.*)$/gm, '<h1>$1</h1>')
       .replace(/^&gt; (.*)$/gm, '<blockquote>$1</blockquote>')
       .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
       .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
       .replace(/`([^`\n]+)`/g, '<code>$1</code>')
       .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // tables
  s = s.replace(/(?:^\|.*\|\s*$\n?)+/gm, tbl => {
    const rows = tbl.trim().split('\n').map(r => r.trim());
    if (rows.length < 2 || !/^\|[\s:|-]+\|$/.test(rows[1])) return tbl;
    const cells = r => r.slice(1, -1).split('|').map(c => c.trim());
    const head = cells(rows[0]).map(c => `<th>${c}</th>`).join('');
    const body = rows.slice(2).map(r =>
      `<tr>${cells(r).map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
    return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  });

  // lists
  s = s.replace(/(?:^[-*] .*$\n?)+/gm, m =>
    '<ul>' + m.trim().split('\n').map(l => `<li>${l.replace(/^[-*] /, '')}</li>`).join('') + '</ul>');
  s = s.replace(/(?:^\d+\. .*$\n?)+/gm, m =>
    '<ol>' + m.trim().split('\n').map(l => `<li>${l.replace(/^\d+\. /, '')}</li>`).join('') + '</ol>');

  // A paragraph that is nothing but a fenced-block placeholder must NOT be
  // wrapped in <p> — <p><pre> is invalid, browsers auto-close the <p> and you
  // are left with a stray empty paragraph adding a margin before every code
  // block.
  s = s.split(/\n{2,}/).map(p =>
    /^\s*<(h[123]|ul|ol|table|blockquote|pre)/.test(p) || /^\s*\u0000B\d+\u0000\s*$/.test(p)
      ? p
      : (p.trim() ? `<p>${p.replace(/\n/g, '<br>')}</p>` : '')
  ).join('');

  return s.replace(/␀B(\d+)␀/g, (_, i) => {
    const b = blocks[i];
    return `<pre><code class="language-${esc(b.lang)}">${esc(b.code)}</code></pre>`;
  });
}
function highlight(root) {
  if (!window.hljs) return;
  root.querySelectorAll('pre code').forEach(el => { try { hljs.highlightElement(el); } catch {} });
}

/* ── UI shell ─────────────────────────────────────────────────────── */
const UI = {
  view(v) {
    $$('.view').forEach(s => s.classList.toggle('on', s.id === `view-${v}`));
    $$('.view-tab').forEach(b => b.classList.toggle('on', b.dataset.view === v));
    if (v === 'console') Console.refresh();
    if (v === 'compare') Compare.init();
    if (v === 'tools')   Tools.probe();
    this.sidebar(false);
  },
  sidebar(open) {
    $('#sidebar').classList.toggle('open', open);
    $('#scrim').classList.toggle('on', open);
  },
  rail() {
    const r = $('#rail');
    if (window.innerWidth <= 1180) r.classList.toggle('open');
    else $('#shell').classList.toggle('no-rail');
  },
  closeAll() {
    this.sidebar(false);
    $('#rail').classList.remove('open');
  },
};

/* ── artifacts ─────────────────────────────────────────────────────────
   Any fenced html/svg/markdown block, or a code block big enough to be a
   deliverable, becomes an openable artifact rendered in a sandboxed iframe.
   The iframe deliberately has no allow-same-origin: generated markup can run
   its own scripts but cannot reach this page, its storage, or the API. */
const Art = {
  cur: null,
  scan(text, msgId) {
    const found = [];
    const re = /```(\w+)?\n?([\s\S]*?)```/g;
    let m, i = 0;
    while ((m = re.exec(text))) {
      const lang = (m[1] || '').toLowerCase(), code = m[2];
      const renderable = ['html', 'svg', 'xml'].includes(lang) ||
                         /^\s*<(!doctype|html|svg)/i.test(code);
      if (renderable || code.split('\n').length >= 12) {
        const id = `${msgId}-${i++}`;
        this.store(id, { lang: lang || (renderable ? 'html' : 'text'), code, renderable });
        found.push({ id, lang, renderable, lines: code.split('\n').length });
      }
    }
    return found;
  },
  store(id, a) { S.artifacts.set(id, a); },
  open(id) {
    const a = S.artifacts.get(id); if (!a) return;
    this.cur = a;
    $('#artname').textContent = `${a.renderable ? 'Preview' : 'Snippet'} · ${a.lang || 'text'}`;
    $('#acodec').textContent = a.code;
    $('#acodec').className = `language-${a.lang || ''}`;
    highlight($('#acode'));
    $('#artifact').classList.add('on');
    this.tab(a.renderable ? 'preview' : 'code');
  },
  tab(t) {
    const a = this.cur; if (!a) return;
    const preview = t === 'preview' && a.renderable;
    $('#tab-prev').classList.toggle('on', preview);
    $('#tab-code').classList.toggle('on', !preview);
    $('#aframe').classList.toggle('on', preview);
    $('#acode').classList.toggle('on', !preview);
    if (preview) {
      const doc = /^\s*<(!doctype|html)/i.test(a.code) ? a.code
        : `<!doctype html><meta charset="utf-8">
           <style>body{margin:0;padding:16px;font:14px/1.6 system-ui,sans-serif}</style>${a.code}`;
      $('#aframe').srcdoc = doc;
    }
  },
  close() { $('#artifact').classList.remove('on'); },
  copy() {
    if (!this.cur) return;
    navigator.clipboard.writeText(this.cur.code).then(() => toast('Copied'));
  },
  download() {
    if (!this.cur) return;
    const ext = { html: 'html', svg: 'svg', python: 'py', javascript: 'js',
                  bash: 'sh', json: 'json', css: 'css' }[this.cur.lang] || 'txt';
    const b = new Blob([this.cur.code], { type: 'text/plain' });
    const u = URL.createObjectURL(b), a = document.createElement('a');
    a.href = u; a.download = `artifact.${ext}`; a.click();
    setTimeout(() => URL.revokeObjectURL(u), 1000);
  },
  newtab() {
    if (!this.cur) return;
    const w = window.open('', '_blank');
    if (!w) return toast('Popup blocked');
    w.document.write(this.cur.renderable ? this.cur.code : `<pre>${esc(this.cur.code)}</pre>`);
    w.document.close();
  },
};

/* ── voice ─────────────────────────────────────────────────────────────
   In  : MediaRecorder → POST /transcribe → local faster-whisper.
   Out : browser SpeechSynthesis (no server round-trip, no dependency). */
const Voice = {
  rec: null, chunks: [], on: false,
  async probe() {
    try {
      const s = await api('/voice/status');
      if (!s.ready) { $('#mic').style.display = 'none'; }
    } catch { $('#mic').style.display = 'none'; }
  },
  async mic() {
    if (this.on) return this.stop();
    if (!navigator.mediaDevices?.getUserMedia) return toast('No microphone API');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      this.chunks = [];
      this.rec = new MediaRecorder(stream);
      this.rec.ondataavailable = e => e.data.size && this.chunks.push(e.data);
      this.rec.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        this.send(new Blob(this.chunks, { type: 'audio/webm' }));
      };
      this.rec.start();
      this.on = true;
      $('#mic').classList.add('rec'); $('#mic').textContent = '■';
      toast('Listening — tap again to stop');
    } catch (e) { toast('Mic denied: ' + e.message); }
  },
  stop() {
    if (!this.rec) return;
    this.rec.stop(); this.on = false;
    $('#mic').classList.remove('rec'); $('#mic').textContent = '🎙';
  },
  async send(blob) {
    toast('Transcribing…');
    const fd = new FormData();
    fd.append('audio', blob, 'clip.webm');
    try {
      const r = await fetch('/transcribe', { method: 'POST', body: fd });
      const j = await r.json();
      if (j.error) return toast(j.error);
      if (!j.text) return toast('Nothing heard');
      const i = $('#input');
      i.value = (i.value ? i.value + ' ' : '') + j.text;
      i.dispatchEvent(new Event('input'));
      i.focus();
    } catch (e) { toast('Transcribe failed: ' + e.message); }
  },
  toggleSpeak() {
    S.speak = !S.speak;
    $('#speakbtn').classList.toggle('on', S.speak);
    toast(S.speak ? 'Replies will be read aloud' : 'Speech off');
    if (!S.speak) speechSynthesis.cancel();
  },
  say(text) {
    if (!S.speak || !window.speechSynthesis) return;
    // Strip code blocks — nobody wants a model reading braces aloud.
    const clean = text.replace(/```[\s\S]*?```/g, ' (code block) ')
                      .replace(/[*_#`>|]/g, '').slice(0, 1200);
    if (!clean.trim()) return;
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(clean));
  },
};


/* ── shared NDJSON stream reader ────────────────────────────────────────
   /chat, /ask-vault, /deep-research and /exec all stream newline-delimited
   JSON but with different keys, so the parsing lives here once and each
   caller just handles the objects it cares about. */
async function ndjson(url, body, onObj, opts = {}) {
  const r = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body), signal: opts.signal,
  });
  if (!r.ok && !r.body) throw new Error(`HTTP ${r.status}`);
  const rd = r.body.getReader(), dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await rd.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n'); buf = lines.pop();
    for (const ln of lines) {
      if (!ln.trim()) continue;
      let d; try { d = JSON.parse(ln); } catch { continue; }
      onObj(d);
    }
  }
  if (buf.trim()) { try { onObj(JSON.parse(buf)); } catch {} }
}

/* ── attachments ──────────────────────────────────────────────────────
   Text/PDF is extracted server-side and folded into the prompt. Images are
   held as base64 and passed to /chat, which routes them to a vision model. */
const Upload = {
  images: [],
  async pick(el) {
    const f = el.files && el.files[0];
    el.value = '';
    if (!f) return;
    toast(`Uploading ${f.name}…`);
    const fd = new FormData(); fd.append('file', f);
    try {
      const r = await fetch('/upload', { method: 'POST', body: fd });
      const j = await r.json();
      if (j.error) return toast(j.error);
      if (j.kind === 'image') {
        this.images.push({ name: j.name, b64: j.image_b64 });
        this.tray();
        toast(`${j.name} attached — needs a vision model`);
      } else {
        const inp = $('#input');
        inp.value += `${inp.value ? '\n\n' : ''}--- ${j.name} ---\n${j.text}\n--- end ---\n\n`;
        inp.dispatchEvent(new Event('input'));
        inp.focus();
        toast(`${j.name}: ${j.chars} chars${j.truncated ? ' (truncated)' : ''}`);
      }
    } catch (e) { toast('Upload failed: ' + e.message); }
  },
  tray() {
    $('#tray').innerHTML = this.images.map((im, i) =>
      `<div class="attach"><span>🖼</span><span>${esc(im.name)}</span>
       <span class="x" onclick="Upload.drop(${i})">✕</span></div>`).join('');
  },
  drop(i) { this.images.splice(i, 1); this.tray(); },
  take() { const out = this.images.map(i => i.b64); this.images = []; this.tray(); return out; },
};

/* ── tools ────────────────────────────────────────────────────────────── */
const Tools = {
  busy: false,
  _guard() {
    if (this.busy) { toast('A tool is already running'); return false; }
    return true;
  },

  async probe() {
    try {
      const h = await api('/health');
      const b = $('#b-search');
      b.textContent = h.search_ready ? 'searxng up' : 'searxng down';
      b.className = 'badge ' + (h.search_ready ? 'ok' : 'bad');
    } catch {}
    try {
      const v = await api('/ask-vault/status');
      const b = $('#b-vault');
      b.textContent = v.nomic_ready ? `${v.vault_files} notes · ${v.indexed_chunks} chunks`
                                    : 'embed model missing';
      b.className = 'badge ' + (v.nomic_ready ? 'ok' : 'bad');
    } catch {}
  },

  async search() {
    const q = $('#t-search').value.trim(); if (!q || !this._guard()) return;
    const out = $('#o-search'); out.innerHTML = '<div class="prog">searching…</div>';
    this.busy = true;
    try {
      const j = await api('/search', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: q, n: 8 }),
      });
      out.innerHTML = (j.results || []).map(r =>
        `<a class="hit" href="${esc(r.url)}" target="_blank" rel="noopener">
           <div class="t">${esc(r.title || r.url)}</div>
           <div class="u">${esc(r.url)}${r.engine ? ' · ' + esc(r.engine) : ''}</div>
           ${r.content ? `<div class="s">${esc(r.content)}</div>` : ''}
         </a>`).join('') || '<div class="prog">no results</div>';
    } catch (e) { out.innerHTML = `<div class="prog">error: ${esc(e.message)}</div>`; }
    this.busy = false;
  },

  async vault() {
    const q = $('#t-vault').value.trim(); if (!q || !this._guard()) return;
    const out = $('#o-vault'); out.innerHTML = '<span class="cursor"></span>';
    this.busy = true;
    let txt = '';
    try {
      // /ask-vault streams the same shape as /chat.
      await ndjson('/ask-vault', { text: q }, d => {
        if (d.error) txt += `\n\n**Error:** ${d.error}`;
        if (d.token) txt += d.token;
        out.innerHTML = md(txt) + (d.stats ? '' : '<span class="cursor"></span>');
      });
      out.innerHTML = md(txt); highlight(out);
    } catch (e) { out.innerHTML = `<div class="prog">error: ${esc(e.message)}</div>`; }
    this.busy = false;
  },

  async reindex() {
    if (!this._guard()) return;
    this.busy = true; toast('Reindexing vault…');
    try {
      const j = await api('/ask-vault/reindex', { method: 'POST' });
      toast(j.error ? j.error : `Indexed ${j.chunks ?? '?'} chunks`);
      this.probe();
    } catch (e) { toast('Reindex failed: ' + e.message); }
    this.busy = false;
  },

  async research() {
    const q = $('#t-research').value.trim(); if (!q || !this._guard()) return;
    const out = $('#o-research');
    out.innerHTML = '<div class="prog">starting…</div>';
    this.busy = true;
    const steps = [];
    try {
      await ndjson('/deep-research', { query: q, max_rounds: 3, max_time: 600 }, d => {
        if (d.progress) {
          steps.push(d.progress);
          out.innerHTML = steps.map(p => `<div class="prog">${esc(p)}</div>`).join('');
        }
        if (d.error)  out.innerHTML = `<div class="prog">error: ${esc(d.error)}</div>`;
        if (d.report) {
          out.innerHTML = md(d.report) +
            `<div class="trace"><span class="chip vi">${d.sources ?? 0} sources</span>` +
            (d.report_url ? `<a class="chip cy" href="${esc(d.report_url)}" target="_blank" rel="noopener">open in Odysseus ›</a>` : '') +
            '</div>';
          highlight(out);
        }
      });
    } catch (e) { out.innerHTML = `<div class="prog">error: ${esc(e.message)}</div>`; }
    this.busy = false;
  },

  async exec() {
    const t = $('#t-exec').value.trim(); if (!t || !this._guard()) return;
    if (!confirm(`Run this on the server via the agent?\n\n${t}`)) return;
    const out = $('#o-exec'); out.innerHTML = '<div class="prog">running…</div>';
    this.busy = true;
    try {
      await ndjson('/exec', { task: t, model: 'auto' }, d => {
        if (d.progress !== undefined) out.innerHTML = `<div class="prog">running… ${d.progress}s</div>`;
        if (d.error)  out.innerHTML = `<div class="prog">error: ${esc(d.error)}</div>`;
        if (d.result !== undefined) {
          out.innerHTML = md(String(d.result)) +
            `<div class="trace"><span class="chip">${esc(d.model || '?')}</span>
             <span class="chip vi">${d.tool_calls ?? 0} tool calls</span></div>`;
          highlight(out);
        }
      });
    } catch (e) { out.innerHTML = `<div class="prog">error: ${esc(e.message)}</div>`; }
    this.busy = false;
  },
};

/* ── chat ──────────────────────────────────────────────────────────── */
const Chat = {
  fresh() {
    S.conv = null; S.history = []; $('#msgs').innerHTML = '';
    this.empty(); Convs.mark(); UI.view('chat'); $('#input').focus();
  },
  empty() {
    $('#msgs').innerHTML = `
      <div class="empty">
        <div>
          <h2>Command center</h2>
          <p>Local models, your vault, and the server itself — one prompt away.</p>
          <div class="starters">
            ${['How is the Chia farm doing?', "Summarise today's server errors",
               'Write a bash script to find large files', 'What changed on the box this week?']
              .map(s => `<button class="starter" onclick="Chat.starter(this)">${esc(s)}</button>`).join('')}
          </div>
        </div>
      </div>`;
  },
  starter(el) { $('#input').value = el.textContent; this.send(); },

  bubble(role, html, id) {
    const d = document.createElement('div');
    d.className = `msg ${role}`;
    d.id = id || '';
    d.innerHTML = `<div class="who">${role === 'user' ? 'You' : 'FraqtoOS'}</div>
                   <div class="bubble">${html}</div>`;
    const e = $('#msgs').querySelector('.empty'); if (e) e.remove();
    $('#msgs').appendChild(d);
    this.scroll();
    return d;
  },
  scroll() { const s = $('#stream'); s.scrollTop = s.scrollHeight; },

  async send() {
    if (S.busy) { S.abort?.abort(); return; }
    const txt = $('#input').value.trim();
    if (!txt) return;
    $('#input').value = ''; $('#input').style.height = 'auto';

    this.bubble('user', md(txt));
    S.history.push({ role: 'user', content: txt });

    S.busy = true;
    $('#send').textContent = '■';

    // routing
    let model = $('#model').value, trace = null;
    if (model === 'auto') {
      const t0 = performance.now();
      try {
        const c = await api('/classify', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: txt }),
        });
        model = c.model;
        trace = { category: c.category, model, ms: Math.round(performance.now() - t0) };
      } catch { model = 'gpt-oss:20b'; }
    }

    const id = 'm' + Date.now();
    const node = this.bubble('bot', '<span class="cursor"></span>', id);
    const body = node.querySelector('.bubble');

    let answer = '', thinking = '', stats = null;
    S.abort = new AbortController();

    try {
      const r = await fetch('/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        signal: S.abort.signal,
        body: JSON.stringify({
          model, messages: S.history.slice(-24), temperature: 0.7,
          // Attached images go to /chat, which swaps in a vision model itself.
          images: Upload.take(),
        }),
      });
      const rd = r.body.getReader(), dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await rd.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n'); buf = lines.pop();
        for (const ln of lines) {
          if (!ln.trim()) continue;
          let d; try { d = JSON.parse(ln); } catch { continue; }
          if (d.error)    { answer += `\n\n**Error:** ${d.error}`; }
          if (d.thinking) { thinking += d.thinking; }
          if (d.token)    { answer += d.token; }
          if (d.stats)    { stats = d.stats; }
          body.innerHTML =
            (thinking ? `<details class="think" open><summary>◈ thinking…</summary>
                         <div class="body">${esc(thinking)}</div></details>` : '') +
            md(answer) + (d.stats ? '' : '<span class="cursor"></span>');
          this.scroll();
        }
      }
    } catch (e) {
      if (e.name !== 'AbortError') answer += `\n\n**Connection error:** ${e.message}`;
    }

    // final render
    const arts = Art.scan(answer, id);
    body.innerHTML =
      (thinking ? `<details class="think"><summary>◈ reasoning (${thinking.length} chars)</summary>
                   <div class="body">${esc(thinking)}</div></details>` : '') +
      arts.map(a => `<button class="artcard" onclick="Art.open('${a.id}')">
          <span class="ic">${a.renderable ? '◧' : '⌨'}</span>
          <span class="nm">${a.renderable ? 'Live preview' : 'Code'} · ${esc(a.lang || 'text')} · ${a.lines} lines</span>
          <span class="go">open ›</span></button>`).join('') +
      md(answer) +
      `<div class="trace">
         ${trace ? `<span class="chip vi">◈ routed <b>${esc(trace.category)}</b> → ${esc(trace.model)} · ${trace.ms}ms</span>`
                 : `<span class="chip">◈ ${esc(model)}</span>`}
         ${stats ? `<span class="chip cy">${stats.tok_s} tok/s</span>
                    <span class="chip">${stats.prompt_tokens}→${stats.completion_tokens} tok</span>` : ''}
       </div>
       <div class="msgacts">
         <button class="act" onclick="Chat.copy('${id}')">Copy</button>
         <button class="act" onclick="Chat.again()">Retry</button>
         <button class="act" onclick="Voice.say(document.getElementById('${id}').innerText)">Speak</button>
       </div>`;
    highlight(body);

    if (answer.trim()) {
      S.history.push({ role: 'assistant', content: answer });
      Voice.say(answer);
    }
    S.busy = false; S.abort = null; $('#send').textContent = '↑';
    this.scroll();
    Convs.save(model);
  },

  copy(id) {
    const n = document.getElementById(id); if (!n) return;
    navigator.clipboard.writeText(n.innerText).then(() => toast('Copied'));
  },
  again() {
    // Drop the last exchange and resend the prior user turn.
    const last = [...S.history].reverse().find(m => m.role === 'user');
    if (!last) return;
    while (S.history.length && S.history[S.history.length - 1].role !== 'user') S.history.pop();
    S.history.pop();
    $('#msgs').querySelectorAll('.msg').forEach((n, i, all) => { if (i >= all.length - 2) n.remove(); });
    $('#input').value = last.content;
    this.send();
  },
};

/* ── conversations ─────────────────────────────────────────────────── */
const Convs = {
  all: [],
  async load() {
    try {
      const j = await api('/conversations');
      this.all = j.conversations || [];
      this.render();
    } catch { $('#convs').innerHTML = '<div class="group">offline</div>'; }
  },
  render(filter = '') {
    const f = filter.toLowerCase();
    const list = this.all.filter(c => !f || (c.title || '').toLowerCase().includes(f));
    if (!list.length) {
      $('#convs').innerHTML = `<div class="group">${filter ? 'no matches' : 'no conversations'}</div>`;
      return;
    }
    const now = Date.now() / 1000, groups = { Today: [], 'This week': [], Older: [] };
    list.forEach(c => {
      const age = now - (c.updated || 0);
      (age < 86400 ? groups.Today : age < 604800 ? groups['This week'] : groups.Older).push(c);
    });
    $('#convs').innerHTML = Object.entries(groups).filter(([, v]) => v.length).map(([k, v]) =>
      `<div class="group">${k}</div>` + v.map(c => `
        <div class="conv ${c.id === S.conv ? 'on' : ''}" onclick="Convs.open('${c.id}')">
          <span class="t">${esc(c.title || 'Untitled')}</span>
          <span class="x" onclick="event.stopPropagation();Convs.del('${c.id}')" title="Delete">×</span>
        </div>`).join('')).join('');
  },
  mark() { this.render($('#convsearch').value); },

  // Server-side semantic hits, shown with their snippet and score. Falls back
  // silently to whatever the local filter already rendered.
  async semantic(q) {
    try {
      const j = await api('/conversations/search/q?q=' + encodeURIComponent(q));
      const m = j.matches || [];
      if (!m.length) return;
      $('#convs').innerHTML =
        `<div class="group">${esc(j.mode || 'search')} · ${m.length} match${m.length === 1 ? '' : 'es'}</div>` +
        m.map(c => `
          <div class="conv ${c.id === S.conv ? 'on' : ''}" onclick="Convs.open('${c.id}')">
            <span class="t">${esc(c.title || 'Untitled')}
              <span style="display:block;color:var(--tx-3);font-size:11px;overflow:hidden;
                           text-overflow:ellipsis">${esc((c.snippet || '').slice(0, 70))}</span>
            </span>
            ${c.score != null ? `<span class="x" style="opacity:.7;font-family:var(--mono);font-size:10px">${c.score.toFixed(2)}</span>` : ''}
          </div>`).join('');
    } catch {}
  },
  async open(id) {
    try {
      const c = await api('/conversations/' + id);
      S.conv = id; S.history = c.history || [];
      $('#msgs').innerHTML = '';
      S.history.forEach((m, i) => {
        const mid = 'h' + i;
        const node = Chat.bubble(m.role === 'user' ? 'user' : 'bot', md(m.content), mid);
        if (m.role !== 'user') {
          const arts = Art.scan(m.content, mid);
          if (arts.length) {
            node.querySelector('.bubble').insertAdjacentHTML('afterbegin',
              arts.map(a => `<button class="artcard" onclick="Art.open('${a.id}')">
                <span class="ic">${a.renderable ? '◧' : '⌨'}</span>
                <span class="nm">${a.renderable ? 'Live preview' : 'Code'} · ${esc(a.lang || 'text')}</span>
                <span class="go">open ›</span></button>`).join(''));
          }
        }
        highlight(node);
      });
      this.mark(); UI.view('chat');
    } catch (e) { toast('Could not open: ' + e.message); }
  },
  async save(model) {
    if (!S.history.length) return;
    try {
      const j = await api('/conversations', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: S.conv, history: S.history, model,
          title: S.conv ? undefined : S.history[0].content.slice(0, 60),
        }),
      });
      if (j.id) S.conv = j.id;
      this.load();
    } catch {}
  },
  async del(id) {
    if (!confirm('Delete this conversation?')) return;
    try {
      await fetch('/conversations/' + id, { method: 'DELETE' });
      if (S.conv === id) Chat.fresh();
      this.load();
    } catch { toast('Delete failed'); }
  },
};

/* ── compare ───────────────────────────────────────────────────────── */
const Compare = {
  picks: new Set(),
  init() {
    if ($('#cmp-picks').dataset.built) return;
    const useful = S.models.filter(m => !/embed|minilm/i.test(m.name)).slice(0, 8);
    useful.slice(0, 2).forEach(m => this.picks.add(m.name));
    $('#cmp-picks').innerHTML = useful.map(m =>
      `<button class="btn ${this.picks.has(m.name) ? 'go' : ''}"
               data-m="${esc(m.name)}" onclick="Compare.pick(this)">${esc(m.name)}</button>`).join(' ');
    $('#cmp-picks').dataset.built = '1';
  },
  pick(el) {
    const m = el.dataset.m;
    if (this.picks.has(m)) { this.picks.delete(m); el.classList.remove('go'); }
    else if (this.picks.size >= 3) { toast('Three at a time — VRAM is shared with Chia'); }
    else { this.picks.add(m); el.classList.add('go'); }
  },
  async run() {
    const q = $('#cmp-prompt').value.trim();
    if (!q) return toast('Enter a prompt');
    if (!this.picks.size) return toast('Pick at least one model');
    const models = [...this.picks];
    $('#cmp-cols').innerHTML = models.map(m => `
      <div class="cmp-col" id="cc-${CSS.escape(m)}">
        <h4><span class="led idle"></span>${esc(m)}</h4>
        <div class="out"><span class="cursor"></span></div>
        <div class="ft"></div>
      </div>`).join('');
    // Sequential on purpose: OLLAMA_NUM_PARALLEL=1, so firing these together
    // just queues them and makes every timing meaningless.
    for (const m of models) await this.one(m, q);
  },
  async one(model, q) {
    const col = document.getElementById('cc-' + CSS.escape(model));
    const out = col.querySelector('.out'), ft = col.querySelector('.ft');
    col.querySelector('.led').className = 'led';
    let txt = '', stats = null;
    const t0 = performance.now();
    try {
      const r = await fetch('/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model, messages: [{ role: 'user', content: q }] }),
      });
      const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
      while (true) {
        const { done, value } = await rd.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n'); buf = lines.pop();
        for (const ln of lines) {
          if (!ln.trim()) continue;
          let d; try { d = JSON.parse(ln); } catch { continue; }
          if (d.token) txt += d.token;
          if (d.error) txt += `\n\n**Error:** ${d.error}`;
          if (d.stats) stats = d.stats;
          out.innerHTML = md(txt) + (d.stats ? '' : '<span class="cursor"></span>');
        }
      }
    } catch (e) { txt += `\n\n**Failed:** ${e.message}`; }
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    out.innerHTML = md(txt); highlight(out);
    col.querySelector('.led').className = 'led';
    ft.innerHTML = `<span class="chip cy">${stats ? stats.tok_s : '—'} tok/s</span>
                    <span class="chip">${secs}s wall</span>
                    <span class="chip">${stats ? stats.completion_tokens : '—'} tok</span>`;
  },
};

/* ── boot ──────────────────────────────────────────────────────────── */
async function boot() {
  // models
  try {
    const j = await api('/models');
    S.models = j.models || [];
    const sel = $('#model');
    S.models.filter(m => !/embed|minilm/i.test(m.name)).forEach(m => {
      const o = document.createElement('option');
      o.value = m.name;
      o.textContent = `${m.name} · ${m.size_gb}GB`;
      sel.appendChild(o);
    });
  } catch { toast('Ollama unreachable'); }

  // health dot
  try { await api('/health'); } catch { $('#healthdot').classList.add('bad'); }

  Convs.load();
  Voice.probe();
  Tools.probe();
  Chat.empty();
  Rail.tick(); setInterval(() => Rail.tick(), 15000);

  // composer
  const inp = $('#input');
  inp.addEventListener('input', () => {
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 190) + 'px';
    $('#ctxhint').textContent = S.history.length ? `${S.history.length} msgs in context` : '';
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); Chat.send(); }
  });
  $('#model').addEventListener('change', e => {
    $('#routehint').textContent = e.target.value === 'auto'
      ? 'Auto-routing on' : 'Pinned to ' + e.target.value;
  });
  // Debounced server-side semantic search. The old client-side substring
  // filter could only match a title; /conversations/search/q searches message
  // bodies by embedding, which is the whole point of the endpoint.
  let searchT;
  $('#convsearch').addEventListener('input', e => {
    const q = e.target.value.trim();
    clearTimeout(searchT);
    if (!q) return Convs.render('');
    Convs.render(q);                       // instant local feedback
    searchT = setTimeout(() => Convs.semantic(q), 350);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { Art.close(); UI.closeAll(); }
  });
  inp.focus();
}
boot();
</script>
</body>
</html>
